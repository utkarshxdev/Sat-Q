[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-geo"
version = "0.1.0"
description = "GeoTIFF input processing primitives for SatQuery AI."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "rasterio>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["geo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
