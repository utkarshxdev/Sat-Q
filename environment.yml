name: satquery
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # Core ML — pytorch nightly on Mac gets MPS; Colab gets CUDA via pip override
  - pip:
    - torch==2.2.2
    - torchvision==0.17.2
    - torchaudio==2.2.2

    # Vision backbones & utilities
    - timm==0.9.16
    - einops==0.7.0
    - segmentation-models-pytorch==0.3.3

    # Remote-sensing geo stack
    - rasterio==1.3.10
    - pyproj==3.6.1
    - shapely==2.0.4
    - torchgeo==0.5.2

    # HuggingFace ecosystem (streaming datasets + model hub)
    - transformers==4.40.2
    - datasets==2.19.1
    - huggingface-hub==0.23.0

    # ONNX export & runtime
    - onnx==1.16.0
    - onnxruntime==1.18.0          # CPU fallback; replace with onnxruntime-gpu on Colab

    # Numerics & visualisation
    - numpy==1.26.4
    - Pillow==10.3.0
    - matplotlib==3.8.4
    - opencv-python-headless==4.9.0.80
    - scikit-image==0.23.2

    # Testing & dev
    - pytest==8.2.0
    - pytest-cov==5.0.0

    # Utilities
    - tqdm==4.66.4
    - pydantic==2.7.1
    - rich==13.7.1
